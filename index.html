<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celmarket Radio - Test Błędów</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .player-card { background: #222; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        audio { width: 100%; }
        .track-list { display: flex; flex-direction: column; gap: 5px; }
        .track-item { padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
        .track-item:hover { background: #f0f0f0; }
        .track-item.active { border-color: #2196f3; background: #e3f2fd; }
        #error-log { color: #ff5252; font-size: 12px; margin-top: 10px; background: #fff0f0; padding: 5px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <h1 style="text-align: center; font-size: 20px;">Audio Looper</h1>
    
    <div class="player-card">
        <div id="nowPlaying" style="font-size: 13px; color: #4fc3f7; margin-bottom: 10px;">Wybierz plik z listy</div>
        <audio id="player" controls></audio>
        <div id="error-log"></div>
    </div>

    <div id="list" class="track-list"></div>
</div>

<script>
const player = document.getElementById('player');
const list = document.getElementById('list');
const nowPlaying = document.getElementById('nowPlaying');
const errorLog = document.getElementById('error-log');

// Lista utworów pozostaje taka jak w Twoim pliku
const publicFiles = [
"1.mp3",
"113.mp3",
"2.mp3",
"dudusie.mp3",
"112.mp3",
"3.mp3",
"111.mp3",
"4.mp3",
"110.mp3",
"5.mp3",
"109.mp3",
"6.mp3",
"108.mp3",
"dudusie.mp3",
"7.mp3",
"107.mp3",
"8.mp3",
"106.mp3",
"9.mp3",
"105.mp3",
"10.mp3",
"104.mp3",
"dudusie.mp3",
"11.mp3",
"103.mp3",
"12.mp3",
"102.mp3",
"13.mp3",
"101.mp3",
"14.mp3",
"113.mp3",
"dudusie.mp3",
"15.mp3",
"112.mp3",
"16.mp3",
"111.mp3",
"17.mp3",
"110.mp3",
"18.mp3",
"109.mp3",
"dudusie.mp3",
"19.mp3",
"108.mp3",
"20.mp3",
"107.mp3",
"21.mp3",
"106.mp3",
"22.mp3",
"105.mp3",
"dudusie.mp3",
"23.mp3",
"104.mp3",
"24.mp3",
"103.mp3",
"25.mp3",
"102.mp3",
"26.mp3",
"101.mp3"
];

let currentIndex = -1;
let failedInRow = 0;
let advancing = false;

function buildPlaylist() {
list.innerHTML = "";

publicFiles.forEach((fileName, index) => {
const row = document.createElement("div");
row.className = "track-item";
row.innerHTML =
`<span>${index + 1}. ${fileName}</span>`;

row.onclick = () => play(index);
list.appendChild(row);
});
}

function updateActiveTrack() {
document.querySelectorAll(".track-item").forEach(
(row, index) => {
row.classList.toggle(
"active",
index === currentIndex
);
}
);
}

function play(index) {
if (index < 0 || index >= publicFiles.length) {
return;
}

currentIndex = index;
advancing = false;

const fileName = publicFiles[currentIndex];

errorLog.style.display = "none";
nowPlaying.innerText = "Ładowanie: " + fileName;
updateActiveTrack();

player.src = "./" + fileName;
player.load();

player.play().then(() => {
nowPlaying.innerText = "Gra teraz: " + fileName;
}).catch(err => {
// Nie pomijaj utworu tylko dlatego,
// że przeglądarka zablokowała odtwarzanie.
if (err.name === "NotAllowedError") {
nowPlaying.innerText =
"Kliknij Odtwórz: " + fileName;
errorLog.style.display = "block";
errorLog.innerText =
"Przeglądarka wymaga ręcznego uruchomienia.";
} else if (err.name !== "AbortError") {
errorLog.style.display = "block";
errorLog.innerText =
"Nie udało się uruchomić: " + fileName;
}
});
}

function playNext() {
if (advancing) return;

advancing = true;

if (failedInRow >= publicFiles.length) {
nowPlaying.innerText = "Odtwarzanie zatrzymane";
errorLog.style.display = "block";
errorLog.innerText =
"Nie udało się odtworzyć żadnego kolejnego pliku. Sprawdź nazwy i dostępność plików.";
advancing = false;
return;
}

const nextIndex = (currentIndex + 1) % publicFiles.length;

if (failedInRow > 0) {
errorLog.style.display = "block";
errorLog.innerText =
"Pominięto niedostępny plik. Próba kolejnego utworu.";
}

play(nextIndex);
}

player.addEventListener("ended", () => {
failedInRow = 0;
playNext();
});

player.addEventListener("playing", () => {
failedInRow = 0;
advancing = false;
errorLog.style.display = "none";
});

player.addEventListener("error", () => {
failedInRow++;

errorLog.style.display = "block";
errorLog.innerText =
"Błąd pliku: " + publicFiles[currentIndex];

playNext();
});

buildPlaylist();
</script>


</body>
</html>
